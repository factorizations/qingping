name: Build QingPing APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 源码直接位于仓库根（含 settings.gradle.kts），不再从 ZIP 解压。
      - name: Show project layout
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- settings file ---"
          test -f settings.gradle.kts && echo "settings.gradle.kts OK"

      - name: Build debug APK
        run: set -o pipefail && gradle -p . --no-daemon assembleDebug 2>&1 | tee build.log
        # 失败时把 Kotlin/Gradle 错误行透出为 annotation，便于远程诊断
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|Execution failed" build.log | head -40 | while read -r line; do
            echo "::error::$line"
          done
          test -f build.log && tail -60 build.log || true
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3

      - name: Verify APK signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -Ei "Signer #1 certificate (DN|SHA-256)" \
            | while read -r line; do echo "::notice::$line"; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingPing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
